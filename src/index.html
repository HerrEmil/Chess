<!doctype html>
<html lang="en">
  <head>
    <title>Chess!</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Chess! is a free light-weight HTML5 app. Play against one of the three different AI opponents or local multiplayer :)"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#a8a09a" />
    <link rel="ICON" href="favicon.ico" />
    <link rel="SHORTCUT ICON" href="favicon.ico" />
    <link rel="modulepreload" href="chess/main.js" />
    <link rel="stylesheet" type="text/css" href="default.css" />

    <!-- Chess! -->
    <script type="module" src="chess/main.js"></script>
  </head>
  <body>
    <!-- Content -->
    <div id="main">
      <div class="tray-row" id="top-tray">
        <div class="button-group">
          <button
            id="restartBtn"
            class="hidden"
            onclick="restartGame()"
            type="button"
            title="New Game"
            aria-label="New Game"
          >
            &#8634;&#xFE0E;
          </button>
          <button
            id="undoBtn"
            class="hidden"
            onclick="undoMove()"
            type="button"
            title="Undo Move"
            aria-label="Undo Move"
          >
            &#8617;&#xFE0E;
          </button>
        </div>
        <div id="captured-black" class="captured-tray"></div>
        <p id="blackTurn2">&#8592;&#xFE0E;</p>
      </div>
      <div id="board-wrapper">
        <table id="board" role="presentation"></table>
      </div>
      <div class="tray-row" id="bottom-tray">
        <p id="blackTurn2Landscape" class="landscape-only">&#8592;&#xFE0E;</p>
        <div id="captured-white" class="captured-tray"></div>
        <p id="whiteTurn2" class="invisible">&#8592;&#xFE0E;</p>
      </div>
    </div>

    <!-- Pawn promotion dialog -->
    <div
      id="conversion"
      class="overlay hidden"
      role="dialog"
      aria-label="Pawn promotion"
    >
      <h1>Convert pawn to?</h1>
      <input type="radio" name="convert" value="queen" checked />&#9819;
      <input type="radio" name="convert" value="rook" />&#9820;
      <input type="radio" name="convert" value="knight" />&#9822;
      <input type="radio" name="convert" value="bishop" />&#9821;
      <br />
      <button type="button" id="convertAccept" onclick="convertPawn()">
        Accept
      </button>
    </div>

    <!-- Start menu -->
    <div id="background" class="nothidden">
      <div id="startMenu">
        <h2 id="menuHeading">Welcome! Please set players</h2>
        <label for="whitePlayer"><h3>White player</h3></label>
        <select id="whitePlayer" name="whitePlayer">
          <option selected>Player</option>
          <option>AI - 1 ply</option>
          <option>AI - 2 ply</option>
          <option>AI - 3 ply</option>
          <option>AI - 4 ply</option>
          <option>AI - 5 ply</option>
          <option>AI - 6 ply</option>
        </select>
        <br />
        <label for="blackPlayer"><h3>Black player</h3></label>
        <select id="blackPlayer" name="blackPlayer">
          <option>Player</option>
          <option>AI - 1 ply</option>
          <option>AI - 2 ply</option>
          <option>AI - 3 ply</option>
          <option selected>AI - 4 ply</option>
          <option>AI - 5 ply</option>
          <option>AI - 6 ply</option>
        </select>
        <br />
        <br />
        <input type="button" value="Play Chess!" onclick="startGame()" />
      </div>
    </div>
  </body>
</html>
