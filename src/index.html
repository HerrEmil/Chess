<!doctype html>
<html lang="en">
  <head>
    <script>
      // SPA fallback router. CloudFront serves this app shell for any path
      // missing from S3 (its 403 -> /index.html rewrite), including static
      // subdirectories such as /encyclopedia/. Forward a bare directory
      // request to that directory's real static index.html before the app
      // boots, so clean URLs like /encyclopedia/ resolve to their page.
      (function () {
        var path = location.pathname;
        if (path !== '/' && path.charAt(path.length - 1) === '/') {
          location.replace(
            path + 'index.html' + location.search + location.hash,
          );
        }
      })();
    </script>
    <title>Chess!</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Chess! is a free light-weight HTML5 app. Play against one of the three different AI opponents or local multiplayer :)"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#a8a09a" />
    <link rel="icon" href="favicon.ico" />
    <link rel="modulepreload" href="chess/main.js" />
    <link rel="stylesheet" type="text/css" href="default.css" />

    <!-- Chess! -->
    <script type="module" src="chess/main.js"></script>
  </head>
  <body>
    <!-- Content -->
    <div id="main">
      <div class="tray-row" id="top-tray">
        <div class="button-group">
          <button
            id="restartBtn"
            class="hidden"
            onclick="restartGame()"
            type="button"
            title="New Game"
            aria-label="New Game"
          >
            &#8634;&#xFE0E;
          </button>
          <button
            id="undoBtn"
            class="hidden"
            onclick="undoMove()"
            type="button"
            title="Undo Move"
            aria-label="Undo Move"
          >
            &#8617;&#xFE0E;
          </button>
        </div>
        <div id="captured-black" class="captured-tray"></div>
        <p id="blackTurn2">&#8592;&#xFE0E;</p>
      </div>
      <div id="board-wrapper">
        <table id="board" role="presentation"></table>
      </div>
      <div class="tray-row" id="bottom-tray">
        <p id="blackTurn2Landscape" class="landscape-only">&#8592;&#xFE0E;</p>
        <div id="captured-white" class="captured-tray"></div>
        <p id="whiteTurn2" class="invisible">&#8592;&#xFE0E;</p>
      </div>
    </div>

    <!-- Pawn promotion dialog -->
    <div
      id="conversion"
      class="overlay hidden"
      role="dialog"
      aria-label="Pawn promotion"
    >
      <h1>Convert pawn to?</h1>
      <label
        ><input
          type="radio"
          name="convert"
          value="queen"
          checked
        />&#9819;</label
      >
      <label><input type="radio" name="convert" value="rook" />&#9820;</label>
      <label><input type="radio" name="convert" value="knight" />&#9822;</label>
      <label><input type="radio" name="convert" value="bishop" />&#9821;</label>
      <br />
      <button type="button" id="convertAccept" onclick="convertPawn()">
        Accept
      </button>
    </div>

    <!-- Start menu -->
    <div id="background" class="nothidden">
      <div id="startMenu">
        <h2 id="menuHeading">Welcome! Please set players</h2>
        <h3><label for="whitePlayer">White player</label></h3>
        <select id="whitePlayer" name="whitePlayer">
          <option selected>Player</option>
          <option>AI - 1 ply</option>
          <option>AI - 2 ply</option>
          <option>AI - 3 ply</option>
          <option>AI - 4 ply</option>
          <option>AI - 5 ply</option>
          <option>AI - 6 ply</option>
        </select>
        <br />
        <h3><label for="blackPlayer">Black player</label></h3>
        <select id="blackPlayer" name="blackPlayer">
          <option>Player</option>
          <option>AI - 1 ply</option>
          <option>AI - 2 ply</option>
          <option>AI - 3 ply</option>
          <option selected>AI - 4 ply</option>
          <option>AI - 5 ply</option>
          <option>AI - 6 ply</option>
        </select>
        <br />
        <br />
        <button type="button" id="playChessBtn" onclick="startGame()">
          Play Chess!
        </button>
        <a id="encyclopediaLink" href="encyclopedia/">Openings encyclopedia</a>
      </div>
    </div>
  </body>
</html>
